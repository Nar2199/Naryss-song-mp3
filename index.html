<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naryss Music - Studio</title>
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(18, 18, 24, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-player { background: rgba(24, 24, 32, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(255, 255, 255, 0.1); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
    </style>
</head>
<body class="bg-[#09090e] text-gray-100 min-h-screen flex flex-col">

    <!-- Professional Welcome Screen -->
    <div id="welcome-screen" class="fixed inset-0 z-50 bg-[#09090e] flex flex-col items-center justify-between p-6 overflow-y-auto">
        <div class="w-full max-w-sm flex flex-col items-center my-auto space-y-6">
            <!-- App Cover (Square) -->
            <div class="relative w-44 h-44 rounded-3xl p-1 bg-gradient-to-tr from-cyan-500 via-purple-600 to-pink-500 shadow-2xl shadow-purple-500/30">
                <img src="./Icon-512x512.png" alt="Naryss Music Cover" class="w-full h-full rounded-[22px] object-cover border-2 border-[#09090e]">
            </div>
            
            <div class="text-center space-y-1">
                <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-white via-purple-200 to-cyan-300">Naryss Music</h1>
                <p class="text-xs text-cyan-400 font-medium">Music Studio • Offline Ready</p>
            </div>

            <!-- Action Buttons -->
            <div class="w-full space-y-3 pt-4">
                <button onclick="enterApp()" class="w-full py-3.5 px-4 rounded-2xl bg-gradient-to-r from-cyan-600 via-purple-600 to-pink-600 text-white font-semibold shadow-lg shadow-purple-600/30 hover:opacity-95 transition flex items-center justify-center space-x-2">
                    <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <span>Start Listening</span>
                </button>
                <button onclick="shareApp()" class="w-full py-3.5 px-4 rounded-2xl glass text-gray-200 font-medium hover:bg-white/10 transition flex items-center justify-center space-x-2">
                    <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                    <span>Share App</span>
                </button>
                <button onclick="openRatingModal()" class="w-full py-3.5 px-4 rounded-2xl glass text-gray-200 font-medium hover:bg-white/10 transition flex items-center justify-center space-x-2">
                    <svg class="w-5 h-5 text-yellow-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                    <span>Rate Us</span>
                </button>
            </div>
        </div>
        <div class="text-[11px] text-gray-500 font-medium pt-4">
            Free for personal use • Privacy Policy
        </div>
    </div>

    <!-- Rate Us Modal -->
    <div id="rating-modal" class="fixed inset-0 z-60 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="glass w-full max-w-xs p-6 rounded-3xl text-center space-y-4 shadow-2xl border border-white/10">
            <h3 class="text-lg font-bold text-white">Enjoying the app?</h3>
            <p class="text-xs text-gray-400">Please rate us 5 stars to support future updates!</p>
            <div class="flex justify-center space-x-1 text-2xl text-yellow-400 cursor-pointer py-1">
                <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
            </div>
            <div class="flex space-x-2 pt-2">
                <button onclick="closeRatingModal()" class="flex-1 py-2.5 rounded-xl bg-white/10 text-gray-300 font-semibold text-xs hover:bg-white/20 transition">Later</button>
                <button onclick="submitRating()" class="flex-1 py-2.5 rounded-xl bg-purple-600 text-white font-semibold text-xs shadow-lg shadow-purple-600/30 hover:bg-purple-500 transition">Submit</button>
            </div>
        </div>
    </div>

    <!-- Main App Content (Hidden Initially) -->
    <div id="main-app-content" class="hidden flex-col min-h-screen pb-40">
        <!-- Header -->
        <header class="glass sticky top-0 z-40 px-5 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <button onclick="backToWelcome()" class="w-9 h-9 rounded-xl glass flex items-center justify-center text-gray-300 hover:text-white transition" title="Home">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <div>
                    <h1 class="font-bold text-lg tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-white via-purple-200 to-cyan-300">Naryss Music</h1>
                    <p class="text-xs text-cyan-400 font-medium">12 Working Tracks</p>
                </div>
            </div>
            <div class="text-xs font-semibold px-3 py-1.5 rounded-full glass text-cyan-300">
                <span id="current-track-num">1</span> / 12
            </div>
        </header>

        <!-- Playlist Container -->
        <main class="flex-1 max-w-xl w-full mx-auto p-4 space-y-4" id="playlist-container">
            <!-- Banner Horizontal Cover -->
            <div class="w-full rounded-2xl overflow-hidden shadow-2xl border border-white/10 bg-gradient-to-r from-purple-900/40 to-cyan-900/40">
                <img src="./banner-512x512_1.png" alt="Naryss Music Banner" class="w-full h-auto object-cover">
            </div>

            <!-- Songs List -->
            <div id="playlist" class="space-y-3"></div>
        </main>
    </div>

    <!-- Bottom Sticky Player (Hidden Initially) -->
    <div id="player-bar" class="fixed bottom-0 left-0 right-0 z-50 glass-player px-4 pt-3 pb-6 transition-all duration-300 hidden">
        <div class="max-w-xl mx-auto space-y-3">
            <div class="flex items-center space-x-3">
                <img id="player-cover" src="" alt="Cover" class="w-12 h-12 rounded-xl object-cover shadow-md border border-white/10">
                <div class="flex-1 min-w-0">
                    <h2 id="player-title" class="text-sm font-bold text-white truncate">Select a track</h2>
                    <p class="text-xs text-cyan-400 truncate">Naryss Music Studio</p>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="space-y-1">
                <input type="range" id="progress-bar" value="0" max="100" class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-cyan-500">
                <div class="flex justify-between text-[10px] text-gray-400 font-medium">
                    <span id="current-time">0:00</span>
                    <span id="total-duration">0:00</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex items-center justify-between px-2">
                <button id="shuffle-btn" class="text-gray-400 hover:text-white transition p-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                </button>
                <button id="prev-btn" class="text-gray-200 hover:text-white p-2">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button id="play-pause-btn" class="w-12 h-12 rounded-full bg-gradient-to-tr from-cyan-500 via-purple-600 to-pink-500 flex items-center justify-center text-white shadow-lg shadow-cyan-500/30 hover:scale-105 transition">
                    <svg id="play-icon" class="w-6 h-6 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pause-icon" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button id="next-btn" class="text-gray-200 hover:text-white p-2">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
                <button id="repeat-btn" class="text-gray-400 hover:text-white transition p-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <audio id="audio-element"></audio>

    <script>
        const baseUrl = "https://raw.githubusercontent.com/Nar2199/Naryss-song-mp3/main/";
        
        const tracks = [
            { title: "Quite fire", audio: "Quiet%20fire%20.mp3", img: "IMG_20260915_221411.png" },
            { title: "Between the heat and us", audio: "Between%20the%20heat%20and%20us%20.mp3", img: "IMG_20260915_221512.png" },
            { title: "I loved you in silence", audio: "I%20loved%20you%20in%20silence%20.mp3", img: "IMG_20260915_221535.png" },
            { title: "Just friends", audio: "Just%20friends%20.mp3", img: "IMG_20260915_221700.png" },
            { title: "Ride into your world", audio: "Ride%20into%20your%20world.mp3", img: "IMG_20260915_221755.png" },
            { title: "Looking into my eyes", audio: "Looking%20into%20my%20eyes%20.mp3", img: "IMG_20260915_221834.png" },
            { title: "Too pure for this world", audio: "Too%20pure%20for%20this%20world%20.mp3", img: "IMG_20260915_221856.png" },
            { title: "She bloomed again", audio: "She%20blowmd%20again.mp3", img: "IMG_20260915_221916.png" },
            { title: "Can you keep up?", audio: "Can%20you%20keep%20up_%20.mp3", img: "IMG_20260915_221935.png" },
            { title: "Catch me if you can", audio: "Catch%20me%20if%20you%20can.mp3", img: "IMG_20260915_221953.png" },
            { title: "New terms", audio: "New%20terms.m4a", img: "IMG_20260915_222038.png" },
            { title: "Money talks", audio: "Money%20talks%20.mp3", img: "IMG_20260915_222058.png" }
        ];

        let currentIndex = 0;
        const audioElement = document.getElementById('audio-element');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const playerTitle = document.getElementById('player-title');
        const playerCover = document.getElementById('player-cover');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const totalDurationEl = document.getElementById('total-duration');
        const currentTrackNum = document.getElementById('current-track-num');
        const playlistEl = document.getElementById('playlist');

        function initPlaylist() {
            playlistEl.innerHTML = '';
            tracks.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = `glass p-3 rounded-2xl flex items-center justify-between cursor-pointer transition hover:bg-white/10 ${index === currentIndex ? 'border-cyan-500/50 bg-cyan-500/10' : ''}`;
                item.innerHTML = `
                    <div class="flex items-center space-x-3 min-w-0">
                        <img src="${baseUrl + track.img}" class="w-12 h-12 rounded-xl object-cover flex-shrink-0 border border-white/10">
                        <div class="min-w-0">
                            <h3 class="text-sm font-semibold truncate ${index === currentIndex ? 'text-cyan-300' : 'text-white'}">${track.title}</h3>
                            <p class="text-xs text-gray-400">Track ${index + 1}</p>
                        </div>
                    </div>
                    <div class="w-9 h-9 rounded-full flex items-center justify-center text-cyan-400 bg-white/5">
                        <svg class="w-4 h-4 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                `;
                item.addEventListener('click', () => {
                    loadTrack(index);
                    playAudio();
                });
                playlistEl.appendChild(item);
            });
        }

        function loadTrack(index) {
            currentIndex = index;
            const track = tracks[index];
            audioElement.src = baseUrl + track.audio;
            playerTitle.textContent = track.title;
            playerCover.src = baseUrl + track.img;
            currentTrackNum.textContent = index + 1;
            initPlaylist();
        }

        function playAudio() {
            audioElement.play().catch(err => console.log("Playback error:", err));
            playIcon.classList.add('hidden');
            pauseIcon.classList.remove('hidden');
        }

        function pauseAudio() {
            audioElement.pause();
            playIcon.classList.remove('hidden');
            pauseIcon.classList.add('hidden');
        }

        playPauseBtn.addEventListener('click', () => {
            if (audioElement.paused) {
                if(!audioElement.src) loadTrack(0);
                playAudio();
            } else {
                pauseAudio();
            }
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % tracks.length;
            loadTrack(currentIndex);
            playAudio();
        });

        document.getElementById('prev-btn').addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + tracks.length) % tracks.length;
            loadTrack(currentIndex);
            playAudio();
        });

        audioElement.addEventListener('timeupdate', () => {
            if (audioElement.duration) {
                progressBar.value = (audioElement.currentTime / audioElement.duration) * 100;
                currentTimeEl.textContent = formatTime(audioElement.currentTime);
                totalDurationEl.textContent = formatTime(audioElement.duration);
            }
        });

        progressBar.addEventListener('input', () => {
            if (audioElement.duration) {
                audioElement.currentTime = (progressBar.value / 100) * audioElement.duration;
            }
        });

        audioElement.addEventListener('ended', () => {
            document.getElementById('next-btn').click();
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function enterApp() {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('main-app-content').style.display = 'flex';
            document.getElementById('player-bar').style.display = 'block';
            initPlaylist();
            if(!audioElement.src) loadTrack(0);
        }

        function backToWelcome() {
            document.getElementById('welcome-screen').style.display = 'flex';
            document.getElementById('main-app-content').style.display = 'none';
            document.getElementById('player-bar').style.display = 'none';
            audioElement.pause();
        }

        function shareApp() {
            if (navigator.share) {
                navigator.share({ title: 'Naryss Music', url: window.location.href });
            } else {
                alert("App link copied to clipboard!");
            }
        }

        function openRatingModal() {
            document.getElementById('rating-modal').style.display = 'flex';
        }

        function closeRatingModal() {
            document.getElementById('rating-modal').style.display = 'none';
        }

        function submitRating() {
            alert("Thank you for your rating! ⭐");
            closeRatingModal();
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
