 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naryss AI Songs</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon.png" type="image/png">
    <style>
        /* التصميم الأساسي للمشغل */
        body {
            background-color: #0f0c1b;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a162b;
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .track-list {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 90px;
        }
        .track-item {
            background: #1a162b;
            padding: 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .track-item:hover {
            background: #26213d;
        }
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #161224;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
        }
        .controls {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-top: 10px;
        }
        button {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 18px;
        }
        .play-btn {
            background: #8a2be2;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        input[type="range"] {
            width: 90%;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2>Naryss AI Songs</h2>
            <p style="color: #b19cd9; margin: 0; font-size: 14px;">12 Working Tracks</p>
        </div>
        <div style="background: #2b2345; padding: 5px 12px; border-radius: 20px; font-size: 12px;">1/12</div>
    </div>

    <!-- حاوية قائمة الأغاني التي كانت مفقودة -->
    <div class="track-list" id="track-list">
        <!-- الأغاني ستظهر هنا تلقائياً -->
    </div>

    <div class="player-bar">
        <div style="width: 100%; max-width: 400px; display: flex; align-items: center; gap: 10px; margin-bottom: 5px;">
            <span id="current-time" style="font-size: 12px;">0:00</span>
            <input type="range" id="progress-bar" value="0" min="0" max="100">
            <span id="total-duration" style="font-size: 12px;">0:00</span>
        </div>
        <div class="controls">
            <button id="prev-btn">⏮</button>
            <button class="play-btn" id="play-btn">▶</button>
            <button id="next-btn">⏭</button>
        </div>
    </div>

    <audio id="audio-element"></audio>

    <script>
        // بيانات الأغاني الـ 12
        const tracks = [
            { title: "Catch me if you can", artist: "Naryss AI", src: "" },
            { title: "New terms", artist: "Naryss AI", src: "" },
            { title: "Money talks", artist: "Naryss AI", src: "" },
            { title: "Quite fire", artist: "Naryss AI", src: "" }
            // باقي الأغاني تضاف هنا
        ];

        let currentTrackIndex = 0;
        const audioElement = document.getElementById('audio-element');
        const playBtn = document.getElementById('play-btn');
        const progressBar = document.getElementById('progress-bar');
        const trackListContainer = document.getElementById('track-list');

        function loadTrack(index) {
            currentTrackIndex = index;
            // يمكنك ربط مصدر الأغنية الفعلي هنا
        }

        function pauseAudio() {
            audioElement.pause();
            playBtn.textContent = "▶";
        }

        playBtn.addEventListener('click', () => {
            if (audioElement.paused) {
                audioElement.play();
                playBtn.textContent = "⏸";
            } else {
                pauseAudio();
            }
        });

        // توليد قائمة الأغاني عرضياً لتعود للظهور
        tracks.forEach((track, index) => {
            const item = document.createElement('div');
            item.className = 'track-item';
            item.innerHTML = `<div><strong>${track.title}</strong><br><small>${track.artist}</small></div>`;
            item.onclick = () => loadTrack(index);
            trackListContainer.appendChild(item);
        });

        loadTrack(0);
        pauseAudio();

        // تفعيل Service Worker للعمل بدون إنترنت
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker registered!', reg))
                    .catch((err) => console.log('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
